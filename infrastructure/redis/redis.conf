# ============================================================================
# RESTAURANT MANAGEMENT SYSTEM (RMS) - REDIS CONFIGURATION
# File: infrastructure/redis/redis.conf
# ============================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB Snapshots)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice

